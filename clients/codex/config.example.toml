# Codex 설정 예시 — ~/.codex/config.toml (또는 프로젝트 .codex/config.toml) 에 병합
#
# command 는 발행된 exe 를 직접 가리킨다.
# `dotnet run` 으로 두면 복원/빌드 때문에 startup_timeout_sec 을 넘겨 연결이 끊길 수 있다.
# exe 는 `powershell.exe -ExecutionPolicy Bypass -File tools\publish.ps1` 로 만든다.

[mcp_servers.doc-bridge]
command = "C:/Tools/DocBridge/dist/doc-bridge-mcp.exe"
args = ["--stdio"]
startup_timeout_sec = 30
tool_timeout_sec = 300

# 쓰기 tool 은 승인 필수 (안전 원칙: dry-run → 사용자 승인 → confirmToken apply)
[mcp_servers.doc-bridge.tools.excel_apply_ops]
approval_mode = "approve"

[mcp_servers.doc-bridge.tools.hwp_apply_ops]
approval_mode = "approve"

[mcp_servers.doc-bridge.tools.cad_apply_ops]
approval_mode = "approve"

# 스냅샷 복원도 고위험
[mcp_servers.doc-bridge.tools.core_restore_snapshot]
approval_mode = "approve"

# ---------------------------------------------------------------------------
# 참고: HTTP 모드로 붙이고 싶을 때 (서버를 따로 띄워 둔 경우)
#   doc-bridge-mcp.exe --http --port 5177
#
# [mcp_servers.doc-bridge]
# url = "http://127.0.0.1:5177/mcp"
#
# DOCBRIDGE_HTTP_TOKEN 환경변수를 설정했다면 Bearer 헤더를 함께 준다:
# [mcp_servers.doc-bridge.http_headers]
# Authorization = "Bearer <토큰>"
